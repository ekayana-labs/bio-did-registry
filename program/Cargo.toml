[package]
name = "bio-did-registry"
version = "0.1.1"
description = "The Solana verifiable data registry backing the did:bio DID method"
authors.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
readme = "../README.md"
keywords = ["solana", "did", "identity", "pinocchio"]
categories = ["cryptography", "authentication"]

[lib]
crate-type = ["cdylib", "lib"]
name = "bio_did_registry"

[features]
default = []
# Build as a library (for CPI callers and clients) without the entrypoint.
no-entrypoint = []

[dependencies]
pinocchio = { version = "0.11.2", features = ["account-resize"] }
pinocchio-system = "0.6.1"
five8_const = "1.0.0"

# On host targets the PDA functions need solana-address's pure Rust fallback.
[target.'cfg(not(target_os = "solana"))'.dependencies]
solana-address = { version = "2", features = ["curve25519"] }

[dev-dependencies]
# 0.10 pinned: newer litesvm needs a Rust release beyond the pinned toolchain.
litesvm = "0.10"
solana-message = "3"
solana-transaction = "3"
solana-signer = "3"
solana-keypair = "3"
solana-pubkey = "3"
solana-instruction = "3"
base64 = "0.22"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(target_os, values("solana"))'] }
